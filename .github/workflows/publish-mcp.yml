name: publish-mcp
on:
  push:
    tags:
      - "mcp-v*"
permissions:
  id-token: write # required for npm trusted publishing (OIDC) — no token, no 2FA prompt
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ameer-ui-mcp bundle
      - run: pnpm --filter ameer-ui-mcp test
      - run: npm publish --access public
        working-directory: packages/mcp
