name: publish-mcp
on:
  push:
    tags:
      - "mcp-v*"
permissions:
  id-token: write # required for npm trusted publishing (OIDC) — no token, no 2FA prompt
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # OIDC trusted publishing needs npm >=11.5.1, which Node 22's bundled npm doesn't support
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ocean-uiux-mcp bundle
      - run: pnpm --filter ocean-uiux-mcp test
      - run: npm publish --access public
        working-directory: packages/mcp
        env:
          # Fallback while npm's OIDC token-exchange endpoint 404s on a correctly
          # configured trusted publisher (tracked upstream: npm/cli#8976, #9088).
          # Remove NPM_TOKEN once that's fixed to go back to pure OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
