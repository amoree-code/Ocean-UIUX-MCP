name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm mcp:bundle
      - name: bundle is committed and up to date
        run: git diff --exit-code packages/mcp/registry packages/mcp/previews
      - run: pnpm mcp:test
      - run: pnpm build
